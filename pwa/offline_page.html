<style>body{margin:0;padding:1.5rem 1.25rem;font:1rem system-ui,-apple-system,sans-serif}main{align-self:center;width:100%;max-width:22rem;text-align:left}h1{display:flex;align-items:center;gap:.55rem;font-size:1.4rem;font-weight:700;margin:0 0 .4rem}h1 span{width:.6rem;height:.6rem;border-radius:50%;background:#e0a030;flex:none}.sub{font-size:.95rem;opacity:.65;margin:0 0 1.5rem;line-height:1.4}label{display:block;font-size:.78rem;font-weight:600;opacity:.7;margin:0 0 .3rem}.f{margin-bottom:.9rem}input,select{width:100%;box-sizing:border-box;font:inherit;padding:.7rem .75rem;border-radius:.55rem;border:1px solid rgba(128,128,128,.4);background:transparent;color:inherit}input{-webkit-appearance:none;appearance:none;text-align:left}input:focus,select:focus{outline:2px solid #5f7d4f;outline-offset:1px;border-color:transparent}button{width:100%;font:inherit;font-weight:600;padding:.8rem;border:0;border-radius:.55rem;cursor:pointer}button.pri{background:#5f7d4f;color:#fff;margin-top:.5rem}button.sec{background:transparent;color:inherit;opacity:.65;border:1px solid rgba(128,128,128,.4);margin-top:.7rem}.fila{margin:1.3rem 0 0;font-size:.9rem;padding:.7rem .8rem;border-radius:.55rem;background:rgba(128,128,128,.14)}</style><main><h1><span></span>Sem conex&atilde;o</h1><p class="sub">O lan&ccedil;amento fica guardado no aparelho e sobe sozinho quando a internet voltar.</p><form id="f"><div class="f"><label for="d">Descri&ccedil;&atilde;o</label><input id="d" required></div><div class="f"><label for="v">Valor</label><input id="v" type="number" step="0.01" inputmode="decimal" required></div><div class="f"><label for="dt">Compet&ecirc;ncia</label><input id="dt" type="date" required></div><div class="f"><label for="c">Categoria</label><select id="c" required></select></div><button type="submit" class="pri">Guardar</button></form><p class="fila" id="s" hidden></p><button type="button" class="sec" id="r">Tentar conectar</button></main><script>
var D="gf_offline",F="fila",C="cfg";
function db(cb){var q=indexedDB.open(D,1);q.onupgradeneeded=function(e){var d=e.target.result;if(!d.objectStoreNames.contains(C))d.createObjectStore(C,{keyPath:"k"});if(!d.objectStoreNames.contains(F))d.createObjectStore(F,{keyPath:"external_id"});};q.onsuccess=function(){cb(q.result);};}
function g(i){return document.getElementById(i);}
function conta(d){d.transaction(F).objectStore(F).count().onsuccess=function(e){var n=e.target.result,p=g("s");p.hidden=!n;p.textContent=n?(n===1?"1 lan\u00e7amento guardado, aguardando internet":n+" lan\u00e7amentos guardados, aguardando internet"):"";};}
function uid(){return crypto.randomUUID?crypto.randomUUID():String(Date.now())+Math.random().toString(16).slice(2);}
g("dt").valueAsDate=new Date();
db(function(d){d.transaction(C).objectStore(C).get("snapshot").onsuccess=function(e){var r=e.target.result,s=g("c"),l=(r&&r.dados&&r.dados.categorias)||[];if(!l.length){s.innerHTML='<option value="">abra o app com internet uma vez</option>';return;}var R={R:"Receita",DPF:"Despesa PF",DPJ:"Despesa PJ"},G={};["R","DPF","DPJ"].forEach(function(k){l.filter(function(c){return c.tipo===k;}).forEach(function(c){if(!G[k]){G[k]=document.createElement("optgroup");G[k].label=R[k]||k;s.appendChild(G[k]);}var o=document.createElement("option");o.value=c.id;o.textContent=c.nome;o.setAttribute("data-t",c.tipo);G[k].appendChild(o);});});};conta(d);});
g("f").onsubmit=function(ev){ev.preventDefault();var s=g("c"),o=s.options[s.selectedIndex];if(!s.value)return;var it={external_id:uid(),tipo:o.getAttribute("data-t"),descricao:g("d").value,valor:parseFloat(g("v").value),categoria_id:parseInt(s.value,10),origem_id:null,data_competencia:g("dt").value,data_caixa:null,forma_pagamento:null,observacoes:"criado offline"};db(function(d){var t=d.transaction(F,"readwrite");t.objectStore(F).put(it);t.oncomplete=function(){g("f").reset();g("dt").valueAsDate=new Date();conta(d);};});};
g("r").onclick=function(){location.reload();};
</script>
